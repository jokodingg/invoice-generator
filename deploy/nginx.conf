# Jokoding Invoice: static site plus the invoice history API.
# deploy/install.sh installs this file for you. Manual steps, if you prefer:
# 1. Copy to /etc/nginx/sites-available/invoice and replace invoice.example.com with the real domain.
# 2. Create the login: htpasswd -c /etc/nginx/.htpasswd-invoice <username>
# 3. ln -s /etc/nginx/sites-available/invoice /etc/nginx/sites-enabled/invoice
# 4. nginx -t && systemctl reload nginx
# 5. HTTPS: certbot --nginx -d invoice.example.com

server {
    listen 80;
    listen [::]:80;
    server_name invoice.example.com;

    root /var/www/jokoding-invoice;
    index index.html;

    # Required: the API returns client names, phone numbers and bank details.
    auth_basic "Jokoding Invoice";
    auth_basic_user_file /etc/nginx/.htpasswd-invoice;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Invoice history API: Node service "jokoding-invoice" (server/main.mjs).
    # ^~ stops the regex locations below from catching API paths.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # HTML, JS and CSS revalidate on every load so a redeploy shows up immediately.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Development files never need to be served.
    location ~ ^/(tests|deploy|server|data|package\.json) {
        return 404;
    }
}
