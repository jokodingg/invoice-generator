# Jokoding Invoice: static site, no build step.
# 1. Copy to /etc/nginx/sites-available/invoice and replace invoice.example.com with the real domain.
# 2. ln -s /etc/nginx/sites-available/invoice /etc/nginx/sites-enabled/invoice
# 3. nginx -t && systemctl reload nginx
# 4. HTTPS: certbot --nginx -d invoice.example.com

server {
    listen 80;
    listen [::]:80;
    server_name invoice.example.com;

    root /var/www/jokoding-invoice;
    index index.html;

    # Optional: restrict access with a password (htpasswd -c /etc/nginx/.htpasswd-invoice irfan)
    # auth_basic "Jokoding Invoice";
    # auth_basic_user_file /etc/nginx/.htpasswd-invoice;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML, JS and CSS revalidate on every load so a redeploy shows up immediately.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Development files never need to be served.
    location ~ ^/(tests|deploy|package\.json) {
        return 404;
    }
}
